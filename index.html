<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Snip live</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; color: #eee; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #status { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); max-width: calc(100% - 32px); box-sizing: border-box;
            padding: 10px 18px; border-radius: 10px; background: rgba(32,32,32,.92); border: 1px solid #3a3a3a; text-align: center; }
  #status.fatal { border-color: #c42b1c; }
  #play { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
          padding: 9px 16px; font: inherit; font-size: 14px; color: #fff; background: rgba(0,103,192,.92);
          border: 0; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  #info { position: fixed; top: 10px; right: 12px; padding: 4px 10px; border-radius: 8px; background: rgba(32,32,32,.8);
          font-size: 12px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  body:hover #info:not(:empty) { opacity: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<div id="status">Connecting…</div>
<button id="play" hidden>&#128264; Turn on sound</button>
<div id="info"></div>
<script type="module">import init from "./snip_viewer.js"; init();</script>
</body>
</html>
